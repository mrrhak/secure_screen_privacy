name: secure_screen_privacy
description: "Flutter plugin for capture protection (block screenshots/recording) and app switcher/recents privacy overlays on Android and iOS."
version: 0.0.1
repository: https://github.com/mrrhak/secure_screen_privacy
issue_tracker: https://github.com/mrrhak/secure_screen_privacy/issues

environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.mrrhak.secure_screen_privacy
        pluginClass: SecureScreenPrivacyPlugin
      ios:
        pluginClass: SecureScreenPrivacyPlugin
