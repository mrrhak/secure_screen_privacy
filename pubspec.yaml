name: secure_screen_privacy
description: "Flutter plugin for capture protection (block screenshots/recording) and app switcher/recents privacy overlays on Android and iOS."
version: 0.0.1
repository: https://github.com/mrrhak/secure_screen_privacy
issue_tracker: https://github.com/mrrhak/secure_screen_privacy/issues
funding:
  - https://ko-fi.com/mrrhak
  - https://www.buymeacoffee.com/mrrhak
topics:
  - privacy
  - security
  - screenshot
  - screen-recording
  - secure-screen
screenshots:
  - description: "Android App Switcher showing a plain teal card for the protected app in color mode"
    path: doc/images/android_app_switcher.png

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.16.0
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^29.2.0

flutter:
  plugin:
    platforms:
      android:
        package: com.mrrhak.secure_screen_privacy
        pluginClass: SecureScreenPrivacyPlugin
      ios:
        pluginClass: SecureScreenPrivacyPlugin
