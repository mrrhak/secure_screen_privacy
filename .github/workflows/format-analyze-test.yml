name: Dart CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  format-analyze-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: |
          flutter pub get
          flutter pub get --directory example

      # pigeon is pinned in pubspec.yaml, so the generated files only change
      # when pigeon/messages.dart or the pinned version does.
      - name: Check the Pigeon files are up to date
        run: |
          dart run pigeon --input pigeon/messages.dart
          dart format lib/src/messages.g.dart
          git diff --exit-code

      - name: Format
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos --fatal-warnings .

      - name: Test
        run: flutter test --coverage

      - name: Test example
        run: flutter test
        working-directory: example

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  spell-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Spell check
        uses: streetsidesoftware/cspell-action@v9
        with:
          files: "**"
          incremental_files_only: false
          check_dot_files: true

  # Kotlin unit tests of the Android plugin, run through the example app's
  # Gradle build (the plugin has no Gradle wrapper of its own).
  android-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Writes example/android/local.properties, which Gradle needs to find
      # the Flutter SDK.
      - name: Prepare the example's Android project
        run: flutter build apk --config-only
        working-directory: example

      - name: Android unit tests
        run: ./gradlew :secure_screen_privacy:testDebugUnitTest
        working-directory: example/android

  # Builds the example app for the iOS simulator, which compiles the Swift
  # plugin code.
  ios-build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build for the iOS simulator
        run: flutter build ios --simulator --debug
        working-directory: example

  # The oldest Flutter that pubspec.yaml allows. The example needs a newer
  # one, so only the package is tested here.
  min-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.x
          cache: true

      # pigeon (a dev-only tool for regenerating the platform code) needs a
      # newer Dart than this Flutter has (30.0.3+ needs Flutter 3.44); the tests
      # don't use it.
      - name: Install Dependencies
        run: |
          sed -i "/^  pigeon:/d" pubspec.yaml
          flutter pub get --no-example

      - name: Test
        run: flutter test
