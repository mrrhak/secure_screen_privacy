name: Dart CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  format-analyze-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: |
          flutter pub get
          flutter pub get --directory example

      - name: Format
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos --fatal-warnings .

      - name: Test
        run: flutter test --coverage

      - name: Test example
        run: flutter test
        working-directory: example

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  spell-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Spell check
        uses: streetsidesoftware/cspell-action@v9
        with:
          files: "**"
          incremental_files_only: false
          check_dot_files: true

  # Kotlin unit tests of the Android plugin, run through the example app's
  # Gradle build (the plugin has no Gradle wrapper of its own).
  android-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Writes example/android/local.properties, which Gradle needs to find
      # the Flutter SDK.
      - name: Prepare the example's Android project
        run: flutter build apk --config-only
        working-directory: example

      - name: Android unit tests
        run: ./gradlew :secure_screen_privacy:testDebugUnitTest
        working-directory: example/android

  # Builds the example app for the iOS simulator, which compiles the Swift
  # plugin code.
  ios-build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build for the iOS simulator
        run: flutter build ios --simulator --debug
        working-directory: example

  # Runs example/integration_test on an Android emulator, so the Kotlin
  # plugin code runs for real (the unit tests above can't reach it).
  android-integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Hardware acceleration for the emulator on Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Integration tests on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # The default RAM ran out right after boot ("fork failed: Out of
          # memory"), so Flutter couldn't read the device's API level.
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: example
          # Wait until the device answers before Flutter looks for it.
          script: |
            for i in $(seq 1 60); do [ -n "$(adb shell getprop ro.build.version.sdk 2>/dev/null | tr -d '\r')" ] && break; sleep 2; done
            flutter test integration_test -d emulator-5554

  # Runs example/integration_test on an iPhone simulator, so the Swift
  # plugin code runs for real.
  ios-integration-test:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Boot an iPhone simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl boot "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Integration tests on the iPhone simulator
        run: flutter test integration_test -d ${{ steps.simulator.outputs.udid }}
        working-directory: example

  # The oldest Flutter that pubspec.yaml allows. The example needs a newer
  # one, so only the package is tested here.
  min-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.x
          cache: true

      - name: Install Dependencies
        run: flutter pub get --no-example

      - name: Test
        run: flutter test
